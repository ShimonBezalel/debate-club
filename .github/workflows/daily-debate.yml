name: Publish daily debate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to publish (YYYY-MM-DD); empty uses today"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-debate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run daily debate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          run_date="${{ inputs.date }}"
          if [ -z "$run_date" ]; then
            run_date="$(date -u +%F)"
          fi
          npm run daily:run -- \
            --date "$run_date" \
            --live \
            --model gpt-5.6-luna \
            --judge-model gpt-5.6-luna \
            --reasoning-effort none \
            --max-output-tokens 260 \
            --judge-max-output-tokens 700 \
            --out matches
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run public-db:export
      - run: npm run public-db:validate
      - run: npm run viewer:build
      - name: Commit daily ledger entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish daily debate $(date -u +%F)"
          fi
          git pull --rebase origin main
      - name: Reverify rebased tree
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev
          npm run public-db:export
          npm run public-db:validate
          npm run viewer:build
      - name: Push daily ledger entry
        run: git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: viewer-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
